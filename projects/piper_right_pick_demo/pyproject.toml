[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "piper-right-pick-demo"
version = "0.1.0"
description = "Independent, evidence-recorded right-arm cube pick/place bench"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
right-pick = "right_pick.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
